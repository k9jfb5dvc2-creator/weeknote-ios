name: Build iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unsigned iPhone package
        run: bash scripts/build-ios.sh
      - name: Launch app in iPhone simulator
        timeout-minutes: 10
        run: bash scripts/smoke-ios.sh
      - name: Upload iPhone package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WeekNote-iPhone-unsigned
          path: build/output/
          if-no-files-found: error
          retention-days: 7
